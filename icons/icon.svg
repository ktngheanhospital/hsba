<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042F2E" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Hospital Red/White Medical Plus Icon -->
  <g filter="url(#dropShadow)">
    <!-- White Shield/Emblem Base -->
    <circle cx="256" cy="256" r="170" fill="#FFFFFF" fill-opacity="0.12"/>
    
    <!-- Medical Cross -->
    <path d="M 216 116 L 296 116 A 16 16 0 0 1 312 132 L 312 216 L 396 216 A 16 16 0 0 1 412 232 L 412 280 A 16 16 0 0 1 396 296 L 312 296 L 312 380 A 16 16 0 0 1 296 396 L 216 396 A 16 16 0 0 1 200 380 L 200 296 L 116 296 A 16 16 0 0 1 100 280 L 100 232 A 16 16 0 0 1 116 216 L 200 216 L 200 132 A 16 16 0 0 1 216 116 Z" 
          fill="#FFFFFF" />
    
    <!-- Inner Cyan Cross Accent -->
    <path d="M 236 170 L 276 170 A 8 8 0 0 1 284 178 L 284 236 L 342 236 A 8 8 0 0 1 350 244 L 350 268 A 8 8 0 0 1 342 276 L 284 276 L 284 334 A 8 8 0 0 1 276 342 L 236 342 A 8 8 0 0 1 228 334 L 228 276 L 170 276 A 8 8 0 0 1 162 268 L 162 244 A 8 8 0 0 1 170 236 L 228 236 L 228 178 A 8 8 0 0 1 236 170 Z" 
          fill="#0F766E" />
  </g>

  <!-- Hospital Sub-label indicator -->
  <text x="256" y="448" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#E6FFFA" text-anchor="middle" letter-spacing="2">BV HNĐK NGHỆ AN</text>
</svg>
